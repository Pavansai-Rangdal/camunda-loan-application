spring:
  application:
    name: loan-approval-backend

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}?sslmode=${DB_SSL_MODE:require}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:10000}

camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:{CAMUNDA_GRPC_ADDRESS}}
    rest-address: ${CAMUNDA_REST_ADDRESS:{CAMUNDA_REST_ADDRESS}}
    prefer-rest-over-grpc: false

logging:
  level:
    root: INFO
    com.example.loanapproval: INFO